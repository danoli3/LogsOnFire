name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  unit_tests:
    uses: ./.github/workflows/unit-tests.yml
  native:
    needs: unit_tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: windows-2022
            platform: windows
            arch: x64
            cmake_arch: x64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            cmake_arch: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v6
        with:
          name: logsonfire-test-bundle
          path: fixture-archive
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev rpm
      - name: Windows dependencies and configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          CMAKE_ARCH: ${{ matrix.cmake_arch }}
        run: |
          $triplet = "$env:ARCH-windows-static"
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "sqlite3:$triplet"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build -A $env:CMAKE_ARCH "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=$triplet"
      - name: Unix configuration
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Tests
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          version=$(python tools/version.py --check)
          mkdir -p fixture-replay
          tar -xzf "fixture-archive/logsonfire-$version-tests.tar.gz" -C fixture-replay
          binary="$PWD/build/logsonfire"
          if [[ "$PLATFORM" == windows ]]; then binary="$PWD/build/Release/logsonfire.exe"; fi
          python "fixture-replay/logsonfire-tests-$version/run-tests.py" --binary "$binary"
      - name: Install and smoke test package layout
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/stage"
          python tests/smoke_installed.py "$PWD/stage"
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(python tools/version.py --check)
          mkdir -p dist
          if [[ "$PLATFORM" == windows ]]; then
            generator=ZIP
          else
            generator=TGZ
          fi
          cpack --config build/CPackConfig.cmake -C Release -G "$generator" -B dist -D "CPACK_PACKAGE_FILE_NAME=logsonfire-$version-$PLATFORM-$ARCH"
          if [[ "$PLATFORM" == linux ]]; then
            cpack --config build/CPackConfig.cmake -C Release -G DEB -B dist -D "CPACK_PACKAGE_FILE_NAME=logsonfire-$version-$PLATFORM-$ARCH"
            cpack --config build/CPackConfig.cmake -C Release -G RPM -B dist -D "CPACK_PACKAGE_FILE_NAME=logsonfire-$version-$PLATFORM-$ARCH"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: logsonfire-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
  homebrew:
    needs: unit_tests
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build and test Homebrew formula from this source
        run: |
          version=$(python tools/version.py --check)
          mkdir -p dist
          git archive --format=tar.gz --prefix="logsonfire-$version/" -o "dist/logsonfire-$version-source.tar.gz" HEAD
          python tools/release_manifests.py --repository "$GITHUB_REPOSITORY" --version "$version" --artifacts dist --output dist/manifests --homebrew-only --source-url "file://$PWD/dist/logsonfire-$version-source.tar.gz"
          brew tap-new --no-git local/logsonfire-ci
          cp dist/manifests/homebrew/logsonfire.rb "$(brew --repository local/logsonfire-ci)/Formula/logsonfire.rb"
          brew install --build-from-source local/logsonfire-ci/logsonfire
          brew test local/logsonfire-ci/logsonfire
          logsonfire --output text --version

name: Build and test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: windows-2022
            platform: windows
            arch: x64
            cmake_arch: x64
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            cmake_arch: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev rpm
      - name: Windows dependencies and configuration
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          CMAKE_ARCH: ${{ matrix.cmake_arch }}
        run: |
          $triplet = "$env:ARCH-windows-static"
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "sqlite3:$triplet"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build -A $env:CMAKE_ARCH "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DVCPKG_TARGET_TRIPLET=$triplet"
      - name: Unix configuration
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install and smoke test package layout
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$PWD/stage"
          python tests/smoke_installed.py "$PWD/stage"
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(python -c 'import re; print(re.search(r"project\(LogsOnFire VERSION ([0-9.]+)", open("CMakeLists.txt").read())[1])')
          mkdir -p dist
          if [[ "$PLATFORM" == windows ]]; then
            generator=ZIP
          else
            generator=TGZ
          fi
          cpack --config build/CPackConfig.cmake -C Release -G "$generator" -B dist -D "CPACK_PACKAGE_FILE_NAME=logsonfire-$version-$PLATFORM-$ARCH"
          if [[ "$PLATFORM" == linux ]]; then
            cpack --config build/CPackConfig.cmake -C Release -G DEB -B dist -D "CPACK_PACKAGE_FILE_NAME=logsonfire-$version-$PLATFORM-$ARCH"
            cpack --config build/CPackConfig.cmake -C Release -G RPM -B dist -D "CPACK_PACKAGE_FILE_NAME=logsonfire-$version-$PLATFORM-$ARCH"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: logsonfire-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

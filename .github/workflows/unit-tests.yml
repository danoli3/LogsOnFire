name: Unit tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Version and changelog
        run: python tools/version.py --check
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Package and replay released tests and logs
        run: |
          version=$(python tools/version.py)
          python tools/package_tests.py --output "dist/logsonfire-$version-tests.tar.gz"
          mkdir -p replay
          tar -xzf "dist/logsonfire-$version-tests.tar.gz" -C replay
          python "replay/logsonfire-tests-$version/run-tests.py" --binary "$PWD/build/logsonfire"
      - uses: actions/upload-artifact@v5
        with:
          name: logsonfire-test-bundle
          path: dist/*-tests.tar.gz
          if-no-files-found: error
